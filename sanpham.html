<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Danh mục sản phẩm - Shop Cầu Lông</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="canonical" href="https://haianh.alwaysdata.net/sanpham.html">
    <!-- CSS -->
    <link href="css/tutaoo.css" rel="stylesheet" style="text/css" />
    <style>
        .catalog-container {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 30px;
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        @media (max-width: 768px) {
            .catalog-container {
                grid-template-columns: 1fr;
            }
        }
        /* Banner Danh Mục */
        .category-banner {
            width: 100%;
            height: 200px;
            background-size: cover;
            background-position: center;
            position: relative;
            border-radius: 12px;
            margin-top: 15px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
        }
        .category-banner-overlay {
            position: absolute;
            top:0; left:0; right:0; bottom:0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }
        .category-banner h1 {
            color: white;
            font-size: 32px;
            z-index: 2;
            margin: 0;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
        }
        /* Sidebar Lọc */
        .filter-sidebar {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            height: fit-content;
            box-shadow: var(--shadow-sm);
            transition: background-color 0.3s, border-color 0.3s;
        }
        .filter-group {
            margin-bottom: 22px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 18px;
        }
        .filter-group:last-child {
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 0;
        }
        .filter-title {
            font-weight: 800;
            font-size: 13px;
            margin-bottom: 14px;
            color: var(--text-color);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .brand-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .brand-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-color);
            transition: background 0.15s, color 0.15s;
        }
        .brand-item:hover {
            background: color-mix(in srgb, var(--primary-color) 8%, transparent);
            color: var(--primary-color);
        }
        .brand-item input {
            height: 17px;
            width: 17px;
            cursor: pointer;
            accent-color: var(--primary-color);
            border-radius: 4px;
        }
        .price-inputs {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .price-inputs input {
            width: 100%;
            height: 42px;
            padding: 0 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-color);
            font: inherit;
            font-size: 13px;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .price-inputs input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary-color) 18%, transparent);
            outline: none;
        }
        .filter-select {
            width: 100%;
            min-height: 42px;
            margin-bottom: 10px;
            padding: 0 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--input-bg);
            color: var(--text-color);
            font: inherit;
            font-size: 13px;
            box-sizing: border-box;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .filter-select:focus {
            border-color: var(--primary-color);
            outline: none;
        }
        .btn-filter-apply {
            width: 100%;
            min-height: 44px;
            padding: 10px 16px;
            background: linear-gradient(135deg, var(--bs-red, #e94723), var(--bs-orange, #ff6b35));
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 750;
            font-size: 14px;
            letter-spacing: 0.02em;
            cursor: pointer;
            margin-top: 6px;
            box-shadow: 0 6px 18px rgba(233, 71, 35, 0.25);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-filter-apply:hover {
            transform: translateY(-2px);
            box-shadow: 0 9px 24px rgba(233, 71, 35, 0.38);
        }
        .btn-filter-reset {
            width: 100%;
            min-height: 38px;
            padding: 8px 14px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s;
        }
        .btn-filter-reset:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background: color-mix(in srgb, var(--primary-color) 6%, transparent);
        }
        /* Sắp xếp */
        .catalog-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding: 14px 20px;
            border-radius: 14px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }
        .sort-select {
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            outline: none;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .sort-select:focus {
            border-color: var(--primary-color);
        }
        /* Phân trang */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 45px;
            flex-wrap: wrap;
        }
        .page-btn {
            min-width: 42px;
            height: 42px;
            padding: 0 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .page-btn.active-page {
            background: linear-gradient(135deg, var(--bs-red, #e94723), var(--bs-orange, #ff6b35));
            color: white;
            border-color: transparent;
            box-shadow: 0 6px 18px rgba(233, 71, 35, 0.32);
        }
        .page-btn:hover:not(.active-page) {
            border-color: var(--primary-color);
            color: var(--primary-color);
            transform: translateY(-2px);
        }
    </style>
    <link rel="stylesheet" href="css/site-refresh.css?v=20260929-site-refresh-css-fix-1">
    <link rel="stylesheet" href="css/mega-animations.css?v=20260929-css-parse-fix-2">
    <link rel="stylesheet" href="css/universal-animations.css?v=20260930-touch-a11y-1">
</head>
<body>
    <div class="baotrang">
        <!-- Header sẽ được chèn tự động -->
        <div class="header"></div>

        <!-- Menu sẽ được chèn tự động -->
        <div id="menu"></div>

        <div class="container" style="max-width: 1200px; margin: 0 auto; padding: 0 20px;">
            <!-- Banner danh mục động -->
            <div class="category-banner" id="categoryBanner">
                <div class="category-banner-overlay"></div>
                <h1 id="categoryTitle">Tất cả sản phẩm</h1>
            </div>
        </div>

        <!-- Vùng Catalog chính -->
        <div class="catalog-container">
            <!-- Sidebar bộ lọc -->
            <button type="button" id="catalogFilterToggle" class="catalog-filter-toggle" aria-controls="catalogFilters" aria-expanded="false">Bộ lọc sản phẩm ▾</button>
            <aside class="filter-sidebar is-collapsed" id="catalogFilters">
                <div class="filter-group">
                    <div class="filter-title">Hãng sản xuất</div>
                    <div class="brand-list" id="brandList">
                        <label class="brand-item"><input type="checkbox" value="Lining"> Lining</label>
                        <label class="brand-item"><input type="checkbox" value="Yonex"> Yonex</label>
                        <label class="brand-item"><input type="checkbox" value="Victor"> Victor</label>
                        <label class="brand-item"><input type="checkbox" value="Kamito"> Kamito</label>
                        <label class="brand-item"><input type="checkbox" value="Apacs"> Apacs</label>
                        <label class="brand-item"><input type="checkbox" value="VNB"> VNB</label>
                        <label class="brand-item"><input type="checkbox" value="Kawasaki"> Kawasaki</label>
                        <label class="brand-item"><input type="checkbox" value="Kumpoo"> Kumpoo</label>
                    </div>
                </div>

                <div class="filter-group">
                    <div class="filter-title">Khoảng giá (VND)</div>
                    <div class="price-inputs">
                        <input type="number" id="priceMin" placeholder="Giá tối thiểu" min="0">
                        <input type="number" id="priceMax" placeholder="Giá tối đa" min="0">
                        <button class="btn-filter-apply" onclick="applyFilters()">Áp dụng lọc</button>
                    </div>
                </div>
                <div class="filter-group" id="racketFilterGroup">
                    <div class="filter-title">Thông số vợt</div>
                    <select class="filter-select" id="filterWeight" aria-label="Lọc trọng lượng và cán"><option value="">Mọi trọng lượng / cán</option><option>3U-G5</option><option>4U-G5</option><option>4U-G6</option><option>5U-G5</option></select>
                    <select class="filter-select" id="filterPlayStyle" aria-label="Lọc lối chơi"><option value="">Mọi lối chơi</option><option value="TAN_CONG">Tấn công</option><option value="CAN_BANG">Cân bằng</option><option value="PHONG_THU">Phòng thủ / tốc độ</option></select>
                    <select class="filter-select" id="filterBalance" aria-label="Lọc điểm cân bằng"><option value="">Mọi điểm cân bằng</option><option value="NANG_DAU">Nặng đầu</option><option value="CAN_BANG">Cân bằng</option><option value="NHE_DAU">Nhẹ đầu</option></select>
                    <select class="filter-select" id="filterStiffness" aria-label="Lọc độ cứng đũa"><option value="">Mọi độ cứng đũa</option><option value="MEM">Mềm</option><option value="TRUNG_BINH">Trung bình</option><option value="CUNG">Cứng</option></select>
                    <button class="btn-filter-reset" type="button" onclick="resetFilters()">Xóa bộ lọc</button>
                </div>
            </aside>

            <!-- Grid danh sách sản phẩm -->
            <main>
                <div class="catalog-header">
                    <div style="font-size:14px; color:var(--text-muted);" id="resultCount">Đang tải sản phẩm...</div>
                    <div>
                        <span style="font-size:14px; font-weight:600; margin-right:8px;">Sắp xếp:</span>
                        <select class="sort-select" id="sortSelect" onchange="applyFilters()">
                            <option value="moi_nhat">Mới cập nhật</option>
                            <option value="ten_asc">Tên (A-Z)</option>
                            <option value="ten_desc">Tên (Z-A)</option>
                            <option value="gia_asc">Giá tăng dần</option>
                            <option value="gia_desc">Giá giảm dần</option>
                        </select>
                    </div>
                </div>

                <div class="danh-sach-san-pham-grid" id="productGrid">
                    <!-- Danh sách sản phẩm được tải động từ API -->
                </div>

                <!-- Phân trang -->
                <div class="pagination" id="pagination"></div>
            </main>
        </div>

        <!-- Footer sẽ được chèn tự động -->
        <div id="cuoitrang"></div>
    </div>

    <!-- Script điều hướng, layout và logic -->
    <script src="css/auth.js?v=20261104-refine-2"></script>
    <script>
        // Bản đồ ảnh nền tương ứng cho từng danh mục
        const BANNER_BGS = {
            1: "HA/anh nen.jpg",       // Vợt
            2: "HA/nengiay.png",       // Giày
            3: "HA/nenao.png",         // Áo
            4: "HA/nenvay.png",        // Váy
            5: "HA/nenquan.png",       // Quần
            6: "HA/nentui.png",        // Túi
            7: "HA/nenbalo.png",       // Balo
            8: "HA/nenphukien.png"     // Phụ kiện
        };

        const CATEGORY_NAMES = {
            1: "Vợt Cầu Lông",
            2: "Giày Cầu Lông",
            3: "Áo Cầu Lông",
            4: "Váy Cầu Lông",
            5: "Quần Cầu Lông",
            6: "Túi Vợt Cầu Lông",
            7: "Balo Cầu Lông",
            8: "Phụ Kiện Cầu Lông"
        };

        let currentCategory = null;
        let currentPage = 1;
        let currentSearchQuery = '';
        let isSale = false;

        function initCatalog() {
            const params = new URLSearchParams(window.location.search);
            
            // Lấy danh mục
            if (params.has('danh_muc')) {
                currentCategory = parseInt(params.get('danh_muc'));
            }
            
            // Lấy từ khóa tìm kiếm
            if (params.has('q')) {
                currentSearchQuery = params.get('q').trim();
            }

            // Lấy sale off
            if (params.has('sale')) {
                isSale = ['true', '1'].includes(params.get('sale'));
            }

            // Giữ nguyên bộ lọc khi người dùng đi từ các gợi ý/lối chơi ở trang chủ
            // hoặc chia sẻ URL. Chỉ nhận các giá trị thực sự có trong select để
            // tránh trạng thái giao diện và truy vấn API không đồng nhất.
            const queryFilterMap = {
                trong_luong: 'filterWeight',
                loi_choi: 'filterPlayStyle',
                can_bang: 'filterBalance',
                do_cung: 'filterStiffness',
                sap_xep: 'sortSelect'
            };
            Object.entries(queryFilterMap).forEach(([queryKey, elementId]) => {
                const value = params.get(queryKey);
                const select = document.getElementById(elementId);
                if (value && select && [...select.options].some(option => option.value === value)) {
                    select.value = value;
                }
            });

            currentPage = Math.max(1, Math.floor(Number(params.get('trang')) || 1));
            ['gia_min', 'gia_max'].forEach((key, index) => {
                const value = params.get(key);
                if (value !== null && Number.isFinite(Number(value)) && Number(value) >= 0) document.getElementById(index ? 'priceMax' : 'priceMin').value = value;
            });
            const selectedBrands = (params.get('thuong_hieu') || '').split(',');
            document.querySelectorAll('#brandList input').forEach(input => { input.checked = selectedBrands.includes(input.value); });
            const filterToggle = document.getElementById('catalogFilterToggle');
            filterToggle.addEventListener('click', () => {
                const collapsed = document.getElementById('catalogFilters').classList.toggle('is-collapsed');
                filterToggle.setAttribute('aria-expanded', String(!collapsed));
                filterToggle.textContent = collapsed ? 'Bộ lọc sản phẩm ▾' : 'Thu gọn bộ lọc ▴';
            });
            // Dựng banner
            setCategoryBanner();
            document.getElementById('racketFilterGroup').hidden = Boolean(currentCategory && currentCategory !== 1);

            // Tải dữ liệu sản phẩm
            fetchCatalogProducts();
        }

        function setCategoryBanner() {
            const banner = document.getElementById('categoryBanner');
            const title = document.getElementById('categoryTitle');
            
            if (isSale) {
                title.textContent = "Sản phẩm SALE OFF";
                banner.style.backgroundImage = `url('HA/giảm 40%.png')`;
                return;
            }

            if (currentSearchQuery) {
                title.textContent = `Tìm kiếm: "${currentSearchQuery}"`;
                banner.style.backgroundImage = `url('HA/anh nen.jpg')`;
                return;
            }

            if (currentCategory && CATEGORY_NAMES[currentCategory]) {
                title.textContent = CATEGORY_NAMES[currentCategory];
                const bg = BANNER_BGS[currentCategory] || "HA/anh nen.jpg";
                banner.style.backgroundImage = `url('${bg}')`;
            } else {
                title.textContent = "Tất cả sản phẩm";
                banner.style.backgroundImage = `url('HA/anh nen.jpg')`;
            }
        }

        function renderCatalogList(products, total) {
            const grid = document.getElementById('productGrid');
            const countLabel = document.getElementById('resultCount');
            if (!products || products.length === 0) {
                grid.innerHTML = '<div style="text-align:center;grid-column:1/-1;color:var(--text-muted);padding:40px;">Không có sản phẩm nào khớp với bộ lọc của bạn!</div>';
                countLabel.textContent = "0 sản phẩm";
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            grid.innerHTML = '';
            countLabel.textContent = `Tìm thấy ${Number(total || products.length)} sản phẩm`;

            products.forEach((p, idx) => {
                const productId = Number(p.MaSP);
                if (!Number.isInteger(productId) || productId <= 0) return;
                const saleActive = Number(p.GiaGoc || 0) > Number(p.GiaBan || 0);
                const card = document.createElement('div');
                card.className = 'product-card-upgraded';
                const href = `chitiet.html?id=${productId}`;
                const media = document.createElement('a');
                media.href = href; media.className = 'img-container';
                const image = document.createElement('img');
                image.src = window.BadmintonAuth ? window.BadmintonAuth.safeUrl(p.HinhAnh, 'HA/cc-removebg-preview.png') : p.HinhAnh;
                image.alt = String(p.TenSP || 'Sản phẩm cầu lông');
                if (idx < 6) {
                    image.loading = 'eager';
                    image.decoding = 'async';
                } else {
                    image.loading = 'lazy';
                    image.decoding = 'async';
                }
                image.onerror = () => { image.onerror = null; image.src = 'HA/cc-removebg-preview.png'; image.classList.add('is-fallback-image'); };
                media.appendChild(image);
                const info = document.createElement('div'); info.className = 'card-info';
                const brand = document.createElement('span'); brand.className = 'brand-tag'; brand.textContent = p.ThuongHieu || 'Chính hãng';
                const title = document.createElement('h3'); title.className = 'title';
                const titleLink = document.createElement('a'); titleLink.href = href; titleLink.textContent = p.TenSP || 'Sản phẩm cầu lông';
                titleLink.style.textDecoration = 'none'; titleLink.style.color = 'inherit'; title.appendChild(titleLink);
                const priceRow = document.createElement('div'); priceRow.className = 'price-row';
                const priceStack = document.createElement('span'); priceStack.className = 'price-stack';
                if (saleActive) { const original = document.createElement('span'); original.className = 'original-price'; original.textContent = `${Number(p.GiaGoc).toLocaleString('vi-VN')} ₫`; priceStack.appendChild(original); }
                const price = document.createElement('span'); price.className = 'price'; price.textContent = `${Number(p.GiaBan || 0).toLocaleString('vi-VN')} ₫`; priceStack.appendChild(price);
                const rating = document.createElement('span'); rating.className = 'rating'; rating.textContent = Number(p.DanhGiaTrungBinh) > 0 ? `⭐ ${Number(p.DanhGiaTrungBinh).toFixed(1)}` : 'Chưa có đánh giá';
                const specs = document.createElement('div'); specs.className = 'cart-item-config';
                [p.TrongLuongCan, p.LoiChoi && String(p.LoiChoi).replaceAll('_', ' '), p.DiemCanBang && String(p.DiemCanBang).replaceAll('_', ' ')].filter(Boolean).forEach(value => { const chip = document.createElement('span'); chip.textContent = value; specs.appendChild(chip); });
                priceRow.append(priceStack, rating); info.append(brand, title); if (specs.childElementCount) info.appendChild(specs); info.appendChild(priceRow);
                card.append(media, info);
                grid.appendChild(card);
            });
        }

        let catalogController = null;
        let catalogRequestId = 0;

        async function fetchCatalogProducts() {
            const requestId = ++catalogRequestId;
            catalogController?.abort();
            const grid = document.getElementById('productGrid');
            const countLabel = document.getElementById('resultCount');
            const minField = document.getElementById('priceMin');
            const maxField = document.getElementById('priceMax');
            const minPrice = minField.value === '' ? 0 : Number(minField.value);
            const maxPrice = maxField.value === '' ? 999999999 : Number(maxField.value);
            const valid = Number.isFinite(minPrice) && Number.isFinite(maxPrice) && minPrice >= 0 && maxPrice >= minPrice;
            maxField.setCustomValidity(valid ? '' : 'Giá tối đa phải lớn hơn hoặc bằng giá tối thiểu; giá không được âm.');
            grid.setAttribute('aria-busy', 'false');
            if (!valid) {
                grid.innerHTML = '<div class="store-state" role="status">Hãy nhập khoảng giá hợp lệ để xem sản phẩm.</div>';
                countLabel.textContent = 'Khoảng giá chưa hợp lệ';
                document.getElementById('pagination').replaceChildren();
                maxField.reportValidity(); return;
            }
            const query = new URLSearchParams({ trang: currentPage, sap_xep: document.getElementById('sortSelect').value, gia_min: minPrice, gia_max: maxPrice });
            if (currentCategory) query.set('danh_muc', currentCategory);
            if (currentSearchQuery) query.set('q', currentSearchQuery);
            if (isSale) query.set('sale', 'true');
            const brands = Array.from(document.querySelectorAll('#brandList input:checked'), input => input.value);
            if (brands.length) query.set('thuong_hieu', brands.join(','));
            if (!currentCategory || currentCategory === 1) {
                Object.entries({ trong_luong: 'filterWeight', loi_choi: 'filterPlayStyle', can_bang: 'filterBalance', do_cung: 'filterStiffness' }).forEach(([key, id]) => {
                    const value = document.getElementById(id).value;
                    if (value) query.set(key, value);
                });
            }
            history.replaceState(null, '', `${location.pathname}?${query}`);
            grid.setAttribute('aria-busy', 'true');
            grid.innerHTML = '<div class="store-state" role="status">Đang tải sản phẩm…</div>';
            countLabel.textContent = 'Đang cập nhật kết quả…';
            document.getElementById('pagination').replaceChildren();
            const controller = new AbortController();
            catalogController = controller;
            const timeout = setTimeout(() => controller.abort(), 12000);
            try {
                const response = await fetch(`${API_BASE}/api/tim-kiem?${query}`, { signal: controller.signal });
                const data = await response.json();
                if (requestId !== catalogRequestId) return;
                if (!response.ok || data.success === false || !Array.isArray(data.products)) throw new Error('Không thể tải sản phẩm.');
                const total = Math.max(0, Number(data.total) || 0);
                const lastPage = Math.max(1, Math.ceil(total / 20));
                if (currentPage > lastPage) { currentPage = lastPage; return fetchCatalogProducts(); }
                renderCatalogList(data.products, total);
                renderPagination(total, 20);
            } catch (error) {
                if (requestId !== catalogRequestId) return;
                countLabel.textContent = 'Chưa tải được sản phẩm';
                grid.innerHTML = '<div class="store-state" role="status"><strong>Chưa kết nối được cửa hàng</strong><p>Vui lòng kiểm tra kết nối và thử lại.</p><button type="button" class="btn-filter-apply">Thử lại</button></div>';
                grid.querySelector('button').addEventListener('click', fetchCatalogProducts);
            } finally {
                clearTimeout(timeout);
                if (requestId === catalogRequestId) grid.setAttribute('aria-busy', 'false');
            }
        }

        function renderPagination(totalItems, itemsPerPage) {
            const container = document.getElementById('pagination');
            container.replaceChildren();
            container.setAttribute('aria-label', 'Phân trang sản phẩm');
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            if (totalPages <= 1) return;
            const addPage = (page, label, accessibleLabel) => {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = `page-btn ${currentPage === page ? 'active-page' : ''}`;
                button.textContent = label;
                button.setAttribute('aria-label', accessibleLabel || `Trang ${page}`);
                if (currentPage === page) button.setAttribute('aria-current', 'page');
                button.addEventListener('click', () => {
                    currentPage = page;
                    fetchCatalogProducts();
                    document.querySelector('.catalog-header').scrollIntoView({ block: 'start' });
                });
                container.appendChild(button);
            };
            if (currentPage > 1) addPage(currentPage - 1, '‹', 'Trang trước');
            const pages = new Set([1, totalPages]);
            for (let page = Math.max(1, currentPage - 1); page <= Math.min(totalPages, currentPage + 1); page++) pages.add(page);
            let previous = 0;
            [...pages].sort((a, b) => a - b).forEach(page => {
                if (previous && page - previous > 1) {
                    const gap = document.createElement('span'); gap.textContent = '…'; gap.setAttribute('aria-hidden', 'true'); container.appendChild(gap);
                }
                addPage(page, String(page)); previous = page;
            });
            if (currentPage < totalPages) addPage(currentPage + 1, '›', 'Trang sau');
        }

        function applyFilters() {
            currentPage = 1;
            fetchCatalogProducts();
        }

        function resetFilters() {
            document.querySelectorAll('#brandList input').forEach(input => { input.checked = false; });
            ['priceMin','priceMax','filterWeight','filterPlayStyle','filterBalance','filterStiffness'].forEach(id => { document.getElementById(id).value = ''; });
            document.getElementById('sortSelect').value = 'moi_nhat';
            applyFilters();
        }

        // Lắng nghe sự kiện click hãng để lọc ngay lập tức
        document.querySelectorAll('#brandList input').forEach(input => {
            input.addEventListener('change', applyFilters);
        });
        document.querySelectorAll('#racketFilterGroup select').forEach(input => input.addEventListener('change', applyFilters));

        // Lắng nghe sự kiện đổi màu nền khi thay đổi theme
        window.addEventListener('themeChanged', () => {
            setCategoryBanner();
        });

        // Khởi động catalog
        document.addEventListener('DOMContentLoaded', initCatalog);
    </script>
    <script src="css/mega-animations.js?v=20261104-refine-2" defer></script>
</body>
