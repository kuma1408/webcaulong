    <style>
        .catalog-container {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 30px;
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        @media (max-width: 768px) {
            .catalog-container {
                grid-template-columns: 1fr;
            }
        }
        /* Banner Danh Mục */
        .category-banner {
            width: 100%;
            height: 200px;
            background-size: cover;
            background-position: center;
            position: relative;
            border-radius: 12px;
            margin-top: 15px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
        }
        .category-banner-overlay {
            position: absolute;
            top:0; left:0; right:0; bottom:0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }
        .category-banner h1 {
            color: white;
            font-size: 32px;
            z-index: 2;
            margin: 0;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
        }
        /* Sidebar Lọc */
        .filter-sidebar {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            height: fit-content;
            box-shadow: var(--shadow-sm);
            transition: background-color 0.3s, border-color 0.3s;
        }
        .filter-group {
            margin-bottom: 22px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 18px;
        }
        .filter-group:last-child {
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 0;
        }
        .filter-title {
            font-weight: 800;
            font-size: 13px;
            margin-bottom: 14px;
            color: var(--text-color);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .brand-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .brand-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-color);
            transition: background 0.15s, color 0.15s;
        }
        .brand-item:hover {
            background: color-mix(in srgb, var(--primary-color) 8%, transparent);
            color: var(--primary-color);
        }
        .brand-item input {
            height: 17px;
            width: 17px;
            cursor: pointer;
            accent-color: var(--primary-color);
            border-radius: 4px;
        }
        .price-inputs {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .price-inputs input {
            width: 100%;
            height: 42px;
            padding: 0 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-color);
            font: inherit;
            font-size: 13px;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .price-inputs input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary-color) 18%, transparent);
            outline: none;
        }
        .filter-select {
            width: 100%;
            min-height: 42px;
            margin-bottom: 10px;
            padding: 0 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--input-bg);
            color: var(--text-color);
            font: inherit;
            font-size: 13px;
            box-sizing: border-box;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .filter-select:focus {
            border-color: var(--primary-color);
            outline: none;
        }
        .btn-filter-apply {
            width: 100%;
            min-height: 44px;
            padding: 10px 16px;
            background: linear-gradient(135deg, var(--bs-red, #e94723), var(--bs-orange, #ff6b35));
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 750;
            font-size: 14px;
            letter-spacing: 0.02em;
            cursor: pointer;
            margin-top: 6px;
            box-shadow: 0 6px 18px rgba(233, 71, 35, 0.25);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-filter-apply:hover {
            transform: translateY(-2px);
            box-shadow: 0 9px 24px rgba(233, 71, 35, 0.38);
        }
        .btn-filter-reset {
            width: 100%;
            min-height: 38px;
            padding: 8px 14px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s;
        }
        .btn-filter-reset:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background: color-mix(in srgb, var(--primary-color) 6%, transparent);
        }
        /* Sắp xếp */
        .catalog-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding: 14px 20px;
            border-radius: 14px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }
        .sort-select {
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            outline: none;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .sort-select:focus {
            border-color: var(--primary-color);
        }
        /* Phân trang */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 45px;
            flex-wrap: wrap;
        }
        .page-btn {
            min-width: 42px;
            height: 42px;
            padding: 0 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .page-btn.active-page {
            background: linear-gradient(135deg, var(--bs-red, #e94723), var(--bs-orange, #ff6b35));
            color: white;
            border-color: transparent;
            box-shadow: 0 6px 18px rgba(233, 71, 35, 0.32);
        }
        .page-btn:hover:not(.active-page) {
            border-color: var(--primary-color);
            color: var(--primary-color);
            transform: translateY(-2px);
        }

        let currentCategory = null;
        let currentPage = 1;
        let currentSearchQuery = '';
        let isSale = false;

        function initCatalog() {
            const params = new URLSearchParams(window.location.search);
            
            // Lấy danh mục
            if (params.has('danh_muc')) {
                currentCategory = parseInt(params.get('danh_muc'));
            }
            
            // Lấy từ khóa tìm kiếm
            if (params.has('q')) {
                currentSearchQuery = params.get('q').trim();
            }

            // Lấy sale off
            if (params.has('sale')) {
                isSale = true;
            }

            // Giữ nguyên bộ lọc khi người dùng đi từ các gợi ý/lối chơi ở trang chủ
            // hoặc chia sẻ URL. Chỉ nhận các giá trị thực sự có trong select để
            // tránh trạng thái giao diện và truy vấn API không đồng nhất.
            const queryFilterMap = {
                trong_luong: 'filterWeight',
                loi_choi: 'filterPlayStyle',
                can_bang: 'filterBalance',
                do_cung: 'filterStiffness',
                sap_xep: 'sortSelect'
            };
            Object.entries(queryFilterMap).forEach(([queryKey, elementId]) => {
                const value = params.get(queryKey);
                const select = document.getElementById(elementId);
                if (value && select && [...select.options].some(option => option.value === value)) {
                    select.value = value;
                }
            });

            // Dựng banner
            setCategoryBanner();
            document.getElementById('racketFilterGroup').hidden = Boolean(currentCategory && currentCategory !== 1);

            // Tải dữ liệu sản phẩm
            fetchCatalogProducts();
        }

        function setCategoryBanner() {
            const banner = document.getElementById('categoryBanner');
            const title = document.getElementById('categoryTitle');
            
            if (isSale) {
                title.textContent = "Sản phẩm SALE OFF";
                banner.style.backgroundImage = `url('HA/giảm 40%.png')`;
                return;
            }

            if (currentSearchQuery) {
                title.textContent = `Tìm kiếm: "${currentSearchQuery}"`;
                banner.style.backgroundImage = `url('HA/anh nen.jpg')`;
                return;
            }

            if (currentCategory && CATEGORY_NAMES[currentCategory]) {
                title.textContent = CATEGORY_NAMES[currentCategory];
                const bg = BANNER_BGS[currentCategory] || "HA/anh nen.jpg";
                banner.style.backgroundImage = `url('${bg}')`;
            } else {
                title.textContent = "Tất cả sản phẩm";
                banner.style.backgroundImage = `url('HA/anh nen.jpg')`;
            }
        }

        function renderCatalogList(products, total) {
            const grid = document.getElementById('productGrid');
            const countLabel = document.getElementById('resultCount');
            if (!products || products.length === 0) {
                grid.innerHTML = '<div style="text-align:center;grid-column:1/-1;color:var(--text-muted);padding:40px;">Không có sản phẩm nào khớp với bộ lọc của bạn!</div>';
                countLabel.textContent = "0 sản phẩm";
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            grid.innerHTML = '';
            countLabel.textContent = `Tìm thấy ${Number(total || products.length)} sản phẩm`;

            products.forEach((p, idx) => {
                const productId = Number(p.MaSP);
                if (!Number.isInteger(productId) || productId <= 0) return;
                const saleActive = Number(p.GiaGoc || 0) > Number(p.GiaBan || 0);
                const card = document.createElement('div');
                card.className = 'product-card-upgraded';
                const href = `chitiet.html?id=${productId}`;
                const media = document.createElement('a');
                media.href = href; media.className = 'img-container';
                const image = document.createElement('img');
                image.src = window.BadmintonAuth ? window.BadmintonAuth.safeUrl(p.HinhAnh, 'HA/cc-removebg-preview.png') : p.HinhAnh;
                image.alt = String(p.TenSP || 'Sản phẩm cầu lông');
                if (idx < 6) {
                    image.loading = 'eager';
                    image.decoding = 'async';
                } else {
                    image.loading = 'lazy';
                    image.decoding = 'async';
                }
                image.onerror = () => { image.src = 'HA/cc-removebg-preview.png'; image.classList.add('is-fallback-image'); };
                media.appendChild(image);
                const info = document.createElement('div'); info.className = 'card-info';
                const brand = document.createElement('span'); brand.className = 'brand-tag'; brand.textContent = p.ThuongHieu || 'Chính hãng';
                const title = document.createElement('h3'); title.className = 'title';
                const titleLink = document.createElement('a'); titleLink.href = href; titleLink.textContent = p.TenSP || 'Sản phẩm cầu lông';
                titleLink.style.textDecoration = 'none'; titleLink.style.color = 'inherit'; title.appendChild(titleLink);
                const priceRow = document.createElement('div'); priceRow.className = 'price-row';
                const priceStack = document.createElement('span'); priceStack.className = 'price-stack';
                if (saleActive) { const original = document.createElement('span'); original.className = 'original-price'; original.textContent = `${Number(p.GiaGoc).toLocaleString('vi-VN')} ₫`; priceStack.appendChild(original); }
                const price = document.createElement('span'); price.className = 'price'; price.textContent = `${Number(p.GiaBan || 0).toLocaleString('vi-VN')} ₫`; priceStack.appendChild(price);
                const rating = document.createElement('span'); rating.className = 'rating'; rating.textContent = `⭐ ${Number(p.DanhGiaTrungBinh || 5).toFixed(1)}`;
                const specs = document.createElement('div'); specs.className = 'cart-item-config';
                [p.TrongLuongCan, p.LoiChoi && String(p.LoiChoi).replaceAll('_', ' '), p.DiemCanBang && String(p.DiemCanBang).replaceAll('_', ' ')].filter(Boolean).forEach(value => { const chip = document.createElement('span'); chip.textContent = value; specs.appendChild(chip); });
                priceRow.append(priceStack, rating); info.append(brand, title); if (specs.childElementCount) info.appendChild(specs); info.appendChild(priceRow);
                card.append(media, info);
                grid.appendChild(card);
            });
        }

        async function fetchCatalogProducts() {
            const grid = document.getElementById('productGrid');
            const countLabel = document.getElementById('resultCount');
            grid.innerHTML = '<div style="text-align:center;grid-column:1/-1;color:var(--text-muted);padding:40px;">Đang tải danh sách sản phẩm...</div>';

            // Thu thập hãng được tick chọn
            const checkedBrands = Array.from(document.querySelectorAll('#brandList input:checked')).map(cb => cb.value);
            
            // Thu thập khoảng giá
            const minPrice = Number(document.getElementById('priceMin').value) || 0;
            const maxPrice = Number(document.getElementById('priceMax').value) || 999999999;
            const sortBy = document.getElementById('sortSelect').value;

            // Lọc tại backend để tổng số và phân trang luôn chính xác.
            const query = new URLSearchParams({ trang: currentPage, sap_xep: sortBy, gia_min: minPrice, gia_max: maxPrice });
            if (currentCategory) query.set('danh_muc', currentCategory);
            if (currentSearchQuery) query.set('q', currentSearchQuery);
            if (isSale) query.set('sale', 'true');
            if (checkedBrands.length) query.set('thuong_hieu', checkedBrands.join(','));
            const specFilters = {
                trong_luong: document.getElementById('filterWeight').value,
                loi_choi: document.getElementById('filterPlayStyle').value,
                can_bang: document.getElementById('filterBalance').value,
                do_cung: document.getElementById('filterStiffness').value
            };
            Object.entries(specFilters).forEach(([key, value]) => { if (value) query.set(key, value); });
            const url = `${API_BASE}/api/tim-kiem?${query}`;

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3500);
                const res = await fetch(url, { signal: controller.signal });
                clearTimeout(timeoutId);
                const data = await res.json();

                if (data.success && data.products && data.products.length > 0) {
                    renderCatalogList(data.products, data.total);
                    renderPagination(data.total, 20);
                    return;
                }
            } catch (e) {
                console.warn("Backend chưa sẵn sàng hoặc ngoại tuyến, sử dụng bộ lọc sản phẩm dự phòng:", e.message);
            }

            // Fallback lọc cục bộ khi backend chưa mở
            let filtered = FALLBACK_CATALOG_PRODUCTS.slice();
            if (currentCategory) {
                filtered = filtered.filter(p => p.MaDM === currentCategory);
            }
            if (currentSearchQuery) {
                const q = currentSearchQuery.toLowerCase();
                filtered = filtered.filter(p => (p.TenSP && p.TenSP.toLowerCase().includes(q)) || (p.ThuongHieu && p.ThuongHieu.toLowerCase().includes(q)));
            }
            if (isSale) {
                filtered = filtered.filter(p => Number(p.GiaGoc || 0) > Number(p.GiaBan || 0));
            }
            if (checkedBrands.length) {
                filtered = filtered.filter(p => checkedBrands.some(b => (p.ThuongHieu || '').toLowerCase().includes(b.toLowerCase())));
            }
            filtered = filtered.filter(p => Number(p.GiaBan || 0) >= minPrice && Number(p.GiaBan || 0) <= maxPrice);
            if (specFilters.trong_luong) filtered = filtered.filter(p => p.TrongLuongCan === specFilters.trong_luong);
            if (specFilters.loi_choi) filtered = filtered.filter(p => p.LoiChoi === specFilters.loi_choi);
            if (specFilters.can_bang) filtered = filtered.filter(p => p.DiemCanBang === specFilters.can_bang);
            if (specFilters.do_cung) filtered = filtered.filter(p => p.DoCungDua === specFilters.do_cung);

            if (sortBy === 'gia_tang') filtered.sort((a, b) => a.GiaBan - b.GiaBan);
            else if (sortBy === 'gia_giam') filtered.sort((a, b) => b.GiaBan - a.GiaBan);

            renderCatalogList(filtered, filtered.length);
            renderPagination(filtered.length, 20);
        }

        function renderPagination(totalItems, itemsPerPage) {
            const paginationDiv = document.getElementById('pagination');
            paginationDiv.innerHTML = '';
            
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            if (totalPages <= 1) return;

            // Nút trước
            if (currentPage > 1) {
                const prev = document.createElement('button');
                prev.className = 'page-btn';
                prev.textContent = '«';
                prev.onclick = () => { currentPage--; fetchCatalogProducts(); window.scrollTo(0, 300); };
                paginationDiv.appendChild(prev);
            }

            // Các trang
            for (let i = 1; i <= totalPages; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.className = `page-btn ${currentPage === i ? 'active-page' : ''}`;
                pageBtn.textContent = i;
                pageBtn.onclick = () => { currentPage = i; fetchCatalogProducts(); window.scrollTo(0, 300); };
                paginationDiv.appendChild(pageBtn);
            }

            // Nút sau
            if (currentPage < totalPages) {
                const next = document.createElement('button');
                next.className = 'page-btn';
                next.textContent = '»';
                next.onclick = () => { currentPage++; fetchCatalogProducts(); window.scrollTo(0, 300); };
                paginationDiv.appendChild(next);
            }
        }

        function applyFilters() {
            currentPage = 1;
            fetchCatalogProducts();
        }

        function resetFilters() {
            document.querySelectorAll('#brandList input').forEach(input => { input.checked = false; });
            ['priceMin','priceMax','filterWeight','filterPlayStyle','filterBalance','filterStiffness'].forEach(id => { document.getElementById(id).value = ''; });
            document.getElementById('sortSelect').value = 'moi_nhat';
            applyFilters();
        }

        // Lắng nghe sự kiện click hãng để lọc ngay lập tức
        document.querySelectorAll('#brandList input').forEach(input => {
            input.addEventListener('change', applyFilters);
        });
        document.querySelectorAll('#racketFilterGroup select').forEach(input => input.addEventListener('change', applyFilters));

        // Lắng nghe sự kiện đổi màu nền khi thay đổi theme
        window.addEventListener('themeChanged', () => {
            setCategoryBanner();
        });

        // Khởi động catalog
        document.addEventListener('DOMContentLoaded', initCatalog);
    </script>
    <script src="css/mega-animations.js?v=20260909-1" defer></script>
